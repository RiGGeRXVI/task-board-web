<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование задачи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="page-header">
        <div class="container">
            <h1>Редактирование задачи</h1>
            <p class="subtitle">Изменение названия, описания и статуса</p>
        </div>
    </header>

    <main class="container">
        <section class="task-form-section">
            <h2>Изменить задачу</h2>

            <form class="task-form" action="{{ url_for('edit_task', id=task.id) }}" method="post">
                <div class="form-group">
                    <label for="title">Название задачи</label>
                    <input type="text" id="title" name="title" value="{{ task.title }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="4">{{ task.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="status">Статус</label>
                    <select id="status" name="status">
                        <option value="todo" {% if task.status == 'todo' %}selected{% endif %}>К выполнению</option>
                        <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>В работе</option>
                        <option value="done" {% if task.status == 'done' %}selected{% endif %}>Готово</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button class="add-task-btn" type="submit">Сохранить изменения</button>
                    <a class="back-btn" href="{{ url_for('index') }}">Назад</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
